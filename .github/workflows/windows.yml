name: Windows executable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: node scripts/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Escapement-Windows-x64
          path: release/Escapement-Windows-x64.exe
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { gh release create ${{ github.ref_name }} --title "Escapement ${{ github.ref_name }}" --notes-file docs/RELEASE.md }
          gh release upload ${{ github.ref_name }} release/Escapement-Windows-x64.exe --clobber

